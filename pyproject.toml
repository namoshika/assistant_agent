[project]
name = "agent-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "namoshika", email = "namoshika@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-community>=0.4.1",
    "langchain-postgres>=0.0.17",
    "langchain[aws,google-genai]>=1.2.10",
    "llama-index>=0.14.18",
    "llama-index-embeddings-google-genai>=0.5.0",
    "llama-index-llms-google-genai>=0.8.7",
    "llama-index-readers-file>=0.6.0",
    "llama-index-readers-obsidian>=0.7.1",
    "llama-index-storage-docstore-postgres>=0.5.0",
    "llama-index-vector-stores-postgres>=0.8.1",
    "obsidianmd-parser>=0.4.0",
    "sqlalchemy>=2.0.48",
    "unstructured[md]>=0.21.5",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: 実際の外部システム (PostgreSQL, Gemini API) を必要とするテスト",
]

[tool.ruff]
extend-exclude = ["scripts/*.ipynb", "docs"]
line-length = 100

[tool.ruff.lint]
extend-select = ["D", "E", "F", "I", "N", "W"]
ignore = ["D100", "D101", "D104", "D203", "D213"]

[dependency-groups]
dev = [
    "boto3>=1.42.63",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "litellm>=1.82.0",
    "mlflow>=3.10.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
