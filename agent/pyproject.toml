[project]
name = "assistant_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "namoshika", email = "namoshika@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.3",
    "discord-py>=2.0",
    "fastapi[standard]>=0.135.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.4.1",
    "langchain-postgres>=0.0.17",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-postgres>=3.1.1",
    "mlflow>=3.11.1",
    "obsidianmd-parser>=0.4.0",
    "pydantic>=2.13.4",
    "sqlalchemy[asyncio]>=2.0.48",
    "typer>=0.19",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
solbot = "assistant_agent.agent_bot:app"

[tool.fastapi]
entrypoint = "assistant_agent.agent_server:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 実際の外部システム (PostgreSQL, Gemini API) を必要とするテスト",
]
env_files = [".env"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"

[tool.ruff]
extend-exclude = ["scripts/*.ipynb", "docs"]
line-length = 100

[tool.ruff.lint]
extend-select = ["D", "E", "F", "I", "N", "W"]
ignore = ["D100", "D101", "D104", "D203", "D213"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
]
