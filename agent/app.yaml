command:
  - /bin/sh
  - -c
  - "uv run --extra app fastapi run --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}"
env:
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment
  - name: AWS_ACCESS_KEY_ID
    valueFrom: aws_access_key_id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom: aws_secret_access_key
  - name: AWS_DEFAULT_REGION
    valueFrom: aws_default_region
  - name: ENV_GEMINI_API_KEY
    valueFrom: gemini_api_key
  - name: ENV_DATABRICKS_TOKEN
    valueFrom: dbx_pat_agent
  - name: ENV_DATABRICKS_VSI_WEBSITE
    valueFrom: dbx_vsi_website
  - name: OPENAI_API_KEY
    value: dummy
